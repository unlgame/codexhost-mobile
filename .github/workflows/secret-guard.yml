name: Secret Guard

on:
  push:
    branches:
      - main
    paths:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codexhost-mobile-secret-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Scan tracked files for signing secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail on suspicious signing key files
        shell: bash
        run: |
          set -euo pipefail
          # 注意：不能写成 `git ls-files -z | python3 - <<'PY'`，heredoc 会抢占 stdin，
          # 导致被跟踪文件列表为空、守卫静默通过。这里先落盘再用 argv 传入。
          git ls-files -z > "$RUNNER_TEMP/secret-guard-tracked.nul"
          python3 - "$RUNNER_TEMP/secret-guard-tracked.nul" <<'PY'
          import os
          import re
          import subprocess
          import sys

          SECRET_NAME_RE = re.compile(r"\.(keystore|jks|pepk)$")
          SECRET_EXACT_NAMES = {"keystore.properties", "local.properties"}
          SKIP_TEXT_SUFFIXES = (".md", ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico")
          MAX_TEXT_BYTES = 262144

          # JKS 魔数 fe ed fe ed；PKCS12 以 30 82 开头的 DER SEQUENCE。
          MAGIC_PREFIXES = (b"\xfe\xed\xfe\xed", b"\x30\x82")
          # 文档里的 keytool 使用示例不算入库，跳过内容扫描。
          TEXT_PATTERNS = (
              (re.compile(rb"\bfeedfeed\b|fe ed fe ed|/u3\+7Q==|MIIK"), "keystore magic bytes"),
              (re.compile(rb"keytool[ \t]+-genkeypair"), "keytool -genkeypair invocation"),
              (re.compile(rb"(storePassword|keyPassword|keyAlias)[ \t]*="), "storePassword/keyPassword/keyAlias assignment"),
          )
          WORKFLOW_PATTERN = re.compile(rb'(storePassword|keyPassword)[ \t]*=[ \t]*"[^$]')

          with open(sys.argv[1], "rb") as handle:
              raw = handle.read()
          tracked = [item.decode("utf-8", "surrogateescape") for item in raw.split(b"\0") if item]
          if not tracked:
              print("::error::No tracked files were found to scan")
              sys.exit(1)

          hits = []

          def record(kind, detail):
              hits.append((kind, detail))

          for path in tracked:
              base = os.path.basename(path)
              if SECRET_NAME_RE.search(base) or base in SECRET_EXACT_NAMES:
                  record("文件名命中", path)

          for path in tracked:
              if not os.path.isfile(path):
                  continue
              with open(path, "rb") as handle:
                  head = handle.read(4)
              if any(head.startswith(prefix) for prefix in MAGIC_PREFIXES):
                  record("内容命中 keystore 魔数", path)

          for path in tracked:
              if not os.path.isfile(path) or path.endswith(SKIP_TEXT_SUFFIXES):
                  continue
              if path.startswith(".github/workflows/") or "lock" in os.path.basename(path):
                  continue
              if os.path.getsize(path) > MAX_TEXT_BYTES:
                  continue
              with open(path, "rb") as handle:
                  blob = handle.read()
              for pattern, label in TEXT_PATTERNS:
                  if pattern.search(blob):
                      record(label, path)
                      break

          for path in tracked:
              if not path.startswith(".github/workflows/") or not path.endswith((".yml", ".yaml")):
                  continue
              if not os.path.isfile(path):
                  continue
              with open(path, "rb") as handle:
                  blob = handle.read()
              if WORKFLOW_PATTERN.search(blob):
                  record("hardcoded storePassword/keyPassword", path)

          if hits:
              for kind, detail in hits:
                  print(f"::error::疑似签名密钥入库：{kind} {detail}")
              print(
                  "::error::疑似签名密钥入库，请立即移除并轮换密钥。"
                  "keystore 与口令永不入库、永不进日志、永不在 issue 或 PR 贴出、永不提交到 fork。"
              )
              sys.exit(1)

          print(f"未发现签名密钥入库，共扫描 {len(tracked)} 个被跟踪文件。")
          PY
