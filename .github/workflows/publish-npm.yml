name: Publish npm Package

on:
  workflow_call:
    inputs:
      app_version:
        description: Version shared by the mobile release
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ inputs.app_version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish codexhost-mobile to npm
    runs-on: ubuntu-latest

    steps:
      - name: TEMP probe OIDC claim
        shell: bash
        run: |
          set -euo pipefail
          jwt="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npmjs.com" | jq -r .value)"
          payload="$(printf '%s' "$jwt" | cut -d. -f2)"
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          printf '%s%s' "$payload" "$(printf '=%.0s' $(seq 1 "$pad"))" |
            tr '_-' '/+' | base64 -d | jq -r '.job_workflow_ref'

      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Match npm version to GitHub Release
        shell: bash
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          version="${APP_VERSION#v}"
          node -e '
            const version = process.argv[1];
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error(`Invalid release version: ${version}`);
            }
          ' "$version"
          npm version "$version" --no-git-tag-version --allow-same-version
          test "$(node -p "require('./package.json').name")" = "codexhost-mobile"
          test "$(node -p "require('./package.json').version")" = "$version"

      - name: Test package
        run: npm test

      - name: Build frontend and gateway
        run: npm run build:package

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish matching npm package
        # 不设 NODE_AUTH_TOKEN 是有意的：这个 job 拿了 id-token: write，
        # 走的是 npm 的可信发布（trusted publishing）。npm CLI 会拿 GitHub
        # Actions 的 OIDC 令牌换一张短时发布令牌，仓库里不留长期密钥。
        # tests/ci/npm-publish-workflow.test.ts 会把这一点钉死，
        # 别为了「本地 publish 方便」把 token 塞回来。
        run: npm publish --access public
