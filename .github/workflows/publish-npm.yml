name: Publish npm Package

on:
  workflow_call:
    inputs:
      app_version:
        description: Version shared by the mobile release
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ inputs.app_version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish codexhost-mobile to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        # 别把 registry-url 加回来。
        #
        # setup-node 一看到它就会做两件事：往 $RUNNER_TEMP/.npmrc 写
        #     //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
        # 并把 NODE_AUTH_TOKEN 默认为 ${{ github.token }}——就是 CI 日志里
        # 脱敏成 XXXXX-XXXXX-XXXXX-XXXXX 的那个。
        #
        # 于是 npm 的推理链变成：registry 配了令牌 → 不用走可信发布 →
        # 拿这个令牌去 PUT → 它当然不是 npm 凭据 → 404。
        #
        # registry 对未授权发布一律回 404，和「包不存在」是同一个码，
        # 所以这个坑长得像 Trusted Publisher 没配对，排查时容易一路走错。
        # 日志里那句「npm tokens that bypass 2FA are being restricted」
        # 是铁证：npm 以为自己手里有令牌。
        #
        # 可信发布本来就不需要 registry-url。删掉之后 .npmrc 和
        # NODE_AUTH_TOKEN 两个问题一起消失，npm 才会回退到 OIDC。
        with:
          node-version: "24"
          # 有意不设 registry-url：见上面的说明。
          # 别加回 registry-url: https://registry.npmjs.org。
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci

      - name: Match npm version to GitHub Release
        shell: bash
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          version="${APP_VERSION#v}"
          node -e '
            const version = process.argv[1];
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error(`Invalid release version: ${version}`);
            }
          ' "$version"
          npm version "$version" --no-git-tag-version --allow-same-version
          test "$(node -p "require('./package.json').name")" = "codexhost-mobile"
          test "$(node -p "require('./package.json').version")" = "$version"

      - name: Test package
        run: npm test

      - name: Build frontend and gateway
        run: npm run build:package

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish matching npm package
        # 不设 NODE_AUTH_TOKEN 是有意的：这个 job 拿了 id-token: write，
        # 走的是 npm 的可信发布（trusted publishing）。npm CLI 会拿 GitHub
        # Actions 的 OIDC 令牌换一张短时发布令牌，仓库里不留长期密钥。
        # 前提是上一步已经把 setup-node 写的空令牌占位行删掉，
        # 否则 npm 会以为自己有令牌，跳过 OIDC 直接用空令牌发。
        run: npm publish --access public
