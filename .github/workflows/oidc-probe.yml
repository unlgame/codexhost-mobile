name: OIDC Probe (temporary)

# 临时诊断用：只在手动触发时跑，不挂 push。
# 目的有两个：
#   1. 打印这个仓库在 reusable workflow 里的 OIDC job_workflow_ref，
#      确认 npm 可信发布该填哪个 workflow 文件名；
#   2. 打印 runner 上 Node 24 自带的 npm 版本，确认 >= 11.5.0。
# 拿到答案就删掉这个文件。

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Report toolchain
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"

      - name: Decode the OIDC token this repo actually gets
        shell: bash
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?id-token: write 没生效，拿不到 OIDC 端点}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?缺少 request token}"
          jwt="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npmjs.com" | jq -r .value)"
          # JWT 的 payload 是第二段，base64url 解码即可。
          payload="$(printf '%s' "$jwt" | cut -d. -f2)"
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          printf '%s' "$payload" | tr '_-' '/+' | {
            head -c $(( ${#payload} + pad ));
            printf '=%.0s' $(seq 1 "$pad");
          } | base64 -d 2>/dev/null | jq .
